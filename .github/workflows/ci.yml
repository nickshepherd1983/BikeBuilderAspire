name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build BikeBuilder.slnx

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    # The Aspire testing host starts SQL Server, Azurite, and the Service Bus / Cosmos
    # emulators plus a stub OIDC issuer - slow on a cold runner, so give it headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Aspire launches the Functions app (BikeBuilder.API.Ratings) through `func start`.
      # Installed straight from the pinned GitHub release: the npm package install needs
      # working registry auth on some runners (E401) and apt needs the Microsoft feed -
      # the zip needs neither.
      - name: Install Azure Functions Core Tools
        run: |
          curl -sSL -o /tmp/func.zip https://github.com/Azure/azure-functions-core-tools/releases/download/4.13.0/Azure.Functions.Cli.linux-x64.4.13.0.zip
          unzip -q /tmp/func.zip -d "$HOME/func-cli"
          chmod +x "$HOME/func-cli/func"
          echo "$HOME/func-cli" >> "$GITHUB_PATH"

      - name: Build test project
        run: dotnet build Src/BikeBuilder.Test.Integration

      - name: Install Playwright browsers
        run: pwsh Src/BikeBuilder.Test.Integration/bin/Debug/net10.0/playwright.ps1 install chromium --with-deps

      - name: Run integration tests
        run: dotnet test Src/BikeBuilder.Test.Integration --no-build --logger "console;verbosity=minimal"

      # The Aspire testing host tears containers down on success; whatever is still here
      # after a failure is what the fixture was stuck waiting on.
      - name: Dump Docker state on failure
        if: failure()
        run: |
          echo "==== docker ps -a ===="
          docker ps -a
          echo "==== docker images ===="
          docker images
          for c in $(docker ps -aq); do
            echo "==== $(docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}}' "$c") ===="
            docker logs --tail 60 "$c" 2>&1 | tail -60
          done

      # Failure screenshots + console logs, and the Playwright videos of every run.
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Src/BikeBuilder.Test.Integration/bin/Debug/net10.0/TestResults/
          if-no-files-found: ignore
