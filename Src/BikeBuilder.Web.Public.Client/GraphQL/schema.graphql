schema {
  query: Query
  mutation: Mutation
}

type Query {
  order(id: Int!): Order
  orders: [Order!]!
  draftOrder(id: UUID!): DraftOrder
  draftOrders: [DraftOrder!]!
}

type Mutation {
  createOrder(customerName: String!, customerEmail: String): DraftOrder!
  addOrderItem(
    orderId: UUID!
    productType: ProductType!
    productId: Int!
    quantity: Int!
  ): DraftOrder!
  removeOrderItem(orderId: UUID!, orderItemId: UUID!): DraftOrder!
  processOrder(orderId: UUID!): Order!
}

"Defines when a policy shall be executed."
enum ApplyPolicy {
  "Before the resolver was executed."
  BEFORE_RESOLVER
  "After the resolver was executed."
  AFTER_RESOLVER
  "The policy is applied in the validation step before the execution."
  VALIDATION
}

enum ProductType {
  COMPONENT
  BIKE_BUILD
}

type Order {
  id: Int!
  customerName: String!
  customerEmail: String
  status: OrderStatus!
  createdAt: DateTime!
  placedAt: DateTime
  items: [OrderItem!]!
  total: Decimal!
}

type OrderItem {
  id: Int!
  orderId: Int!
  productType: ProductType!
  productId: Int!
  productName: String!
  unitPrice: Decimal!
  quantity: Int!
  lineTotal: Decimal!
}

type DraftOrder {
  id: UUID!
  customerName: String!
  customerEmail: String
  createdAt: DateTime!
  expiresAt: DateTime!
  items: [DraftOrderItem!]!
  total: Decimal!
}

type DraftOrderItem {
  id: UUID!
  productType: ProductType!
  productId: Int!
  productName: String!
  unitPrice: Decimal!
  quantity: Int!
  lineTotal: Decimal!
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime

scalar UUID

enum OrderStatus {
  DRAFT
  PLACED
}

"The `Decimal` scalar type represents a decimal floating-point number with high precision."
scalar Decimal

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION