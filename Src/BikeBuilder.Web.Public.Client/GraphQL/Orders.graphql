fragment DraftOrderParts on DraftOrder {
  id
  customerName
  customerEmail
  total
  items {
    id
    productType
    productId
    productName
    unitPrice
    quantity
    lineTotal
  }
}

# Processing swaps the Redis draft for a real SQL order, so that one mutation answers with
# the placed Order rather than a draft - hence its own fragment.
fragment PlacedOrderParts on Order {
  id
  customerName
  status
  total
}

query GetDraftOrder($id: UUID!) {
  draftOrder(id: $id) {
    ...DraftOrderParts
  }
}

mutation CreateOrder($customerName: String!, $customerEmail: String) {
  createOrder(customerName: $customerName, customerEmail: $customerEmail) {
    ...DraftOrderParts
  }
}

mutation AddOrderItem($orderId: UUID!, $productType: ProductType!, $productId: Int!, $quantity: Int!) {
  addOrderItem(orderId: $orderId, productType: $productType, productId: $productId, quantity: $quantity) {
    ...DraftOrderParts
  }
}

mutation RemoveOrderItem($orderId: UUID!, $orderItemId: UUID!) {
  removeOrderItem(orderId: $orderId, orderItemId: $orderItemId) {
    ...DraftOrderParts
  }
}

mutation ProcessOrder($orderId: UUID!) {
  processOrder(orderId: $orderId) {
    ...PlacedOrderParts
  }
}
