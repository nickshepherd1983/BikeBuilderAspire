<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bike Builder Admin</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link href="BikeBuilder.Web.Admin.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:300,400,700,900&display=swap" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <svg class="loading-bike" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="15" cy="45" r="11" fill="none" stroke="#00263A" stroke-width="5" />
            <circle cx="49" cy="45" r="11" fill="none" stroke="#00263A" stroke-width="5" />
            <path d="M15 45 L25 26 L41 26 L49 45 M25 26 L32 45 L15 45 M41 26 L32 45"
                  fill="none" stroke="#CF0030" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M20 19 L30 19 M25 19 L25 26" fill="none" stroke="#CF0030" stroke-width="4.5" stroke-linecap="round" />
            <path d="M44 17 L41 26 M40 17 L48 17" fill="none" stroke="#CF0030" stroke-width="4.5" stroke-linecap="round" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // The .NET 10 dev server no longer forwards its hosting environment to the browser
        // (the Blazor-Environment header only applies to the legacy JSON boot config), so the
        // integration-test environment is selected by the one signal the browser has: the
        // fixed test origin the Aspire AppHost pins. Everything else runs with the default
        // environment and plain appsettings.json.
        Blazor.start(location.host === "127.0.0.1:18200" ? { environment: "IntegrationTest" } : {});
    </script>
</body>

</html>
