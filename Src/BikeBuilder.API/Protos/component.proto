syntax = "proto3";

option csharp_namespace = "BikeBuilder.API.Protos";

package bikebuilder;

service ComponentService {
  rpc ListComponents (ListComponentsRequest) returns (ListComponentsResponse);
  rpc GetComponent (GetComponentRequest) returns (ComponentMessage);
  rpc CreateComponent (CreateComponentRequest) returns (ComponentMessage);
  rpc UpdateComponent (UpdateComponentRequest) returns (ComponentMessage);
  rpc DeleteComponent (DeleteComponentRequest) returns (DeleteComponentResponse);
}

// Prefixed per proto3 style; protoc strips the prefix, so C# sees Manufacturer.Other etc.
enum Manufacturer {
  MANUFACTURER_OTHER = 0;
  MANUFACTURER_SRAM = 1;
  MANUFACTURER_SHIMANO = 2;
  MANUFACTURER_HOPE = 3;
}

message ComponentMessage {
  int32 id = 1;
  string name = 2;
  string cost = 3;
  string description = 4;
  bool has_image = 5;
  int64 image_version = 6;
  string sku = 7;
  Manufacturer manufacturer = 8;
  string component_information_json = 9; // polymorphic ComponentInformation JSON; "" = none
}

// Prefixed per proto3 style; protoc strips the prefix, so C# sees ComponentSortField.Name etc.
enum ComponentSortField {
  COMPONENT_SORT_FIELD_UNSPECIFIED = 0; // server default: Name ascending
  COMPONENT_SORT_FIELD_NAME = 1;
  COMPONENT_SORT_FIELD_COST = 2;
  COMPONENT_SORT_FIELD_SKU = 3;
  COMPONENT_SORT_FIELD_MANUFACTURER = 4;
}

message ListComponentsRequest {
  string search = 1;                 // optional name/SKU filter; empty returns everything
  int32 limit = 2;                   // page size when page > 0, otherwise a plain cap; 0 means default/no cap
  int32 page = 3;                    // 1-based; 0 means not paged (autocomplete/legacy callers)
  ComponentSortField sort_field = 4; // UNSPECIFIED falls back to Name ascending
  bool sort_descending = 5;          // ignored when sort_field is UNSPECIFIED
}

message ListComponentsResponse {
  repeated ComponentMessage components = 1;
  int32 total_count = 2; // count after the search filter, before paging
}

message GetComponentRequest {
  int32 id = 1;
}

message CreateComponentRequest {
  string name = 1;
  string cost = 2;
  string description = 3;
  string sku = 4;
  Manufacturer manufacturer = 5;
  string component_information_json = 6; // polymorphic ComponentInformation JSON; "" = none
}

message UpdateComponentRequest {
  int32 id = 1;
  string name = 2;
  string cost = 3;
  string description = 4;
  string sku = 5;
  Manufacturer manufacturer = 6;
  string component_information_json = 7; // polymorphic ComponentInformation JSON; "" = none
}

message DeleteComponentRequest {
  int32 id = 1;
}

message DeleteComponentResponse {
  bool success = 1;
}
